name: release

# A pushed tag v* builds the universal app and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build/MouseBattery.app "MouseBattery-${GITHUB_REF_NAME}.zip"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MouseBattery-${GITHUB_REF_NAME}.zip" --title "MouseBattery $GITHUB_REF_NAME" --generate-notes
      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: MouseBattery
          path: MouseBattery-*.zip
